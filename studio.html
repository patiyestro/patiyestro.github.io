<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inside the Studio — Pati Yestro</title>

    <meta
        name="description"
        content="Inside the studio of Rwandan contemporary visual artist Pati Yestro."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #F5F1EA;
            color: #171513;
            font-family: "Inter", sans-serif;
            font-weight: 300;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #EDEAE4;
            border-bottom: 1px solid rgba(23, 21, 19, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav {
            max-width: 1350px;
            margin: auto;
            padding: 22px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2.5px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            font-size: 10px;
            letter-spacing: 1.8px;
            text-transform: uppercase;

            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 0.5;
        }

        /* PAGE INTRO */

        .studio-intro {
            max-width: 1350px;
            margin: auto;
            padding: 120px 40px 80px;
        }

        .section-label {
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .studio-title {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(65px, 9vw, 125px);
            font-weight: 400;
            line-height: 0.85;
            max-width: 1000px;
        }

        .studio-intro-text {
            max-width: 650px;
            margin-top: 45px;

            font-size: 13px;
            line-height: 1.8;
        }

        /* STUDIO IMAGES */

        .studio-gallery {
            max-width: 1350px;
            margin: auto;
            padding: 20px 40px 120px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 35px;
        }

        .studio-image {
            background: #DED8CF;
            overflow: hidden;
        }

        .studio-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: transform 0.7s ease;
        }

        .studio-image:hover img {
            transform: scale(1.02);
        }

        .studio-image.large {
            grid-column: span 2;
        }

        .studio-image.large img {
            aspect-ratio: 16 / 9;
        }

        .studio-image:not(.large) img {
            aspect-ratio: 4 / 5;
        }

        /* BACK LINK */

        .back-section {
            max-width: 1350px;
            margin: auto;
            padding: 0 40px 120px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;

            border-bottom: 1px solid #171513;
            padding-bottom: 7px;

            transition: opacity 0.3s ease;
        }

        .back-link span {
            font-size: 16px;

            transition: transform 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.5;
        }

        .back-link:hover span {
            transform: translateX(-5px);
        }

        /* FOOTER */

        footer {
            background: #171513;
            color: #F5F1EA;

            padding: 30px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            .nav {
                padding: 18px 20px;
            }

            .logo {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .nav-links {
                gap: 14px;
            }

            .nav-links a {
                font-size: 8px;
                letter-spacing: 1px;
            }

            .studio-intro {
                padding: 80px 20px 55px;
            }

            .studio-title {
                font-size: clamp(55px, 15vw, 85px);
            }

            .studio-intro-text {
                margin-top: 30px;
                font-size: 12px;
            }

            .studio-gallery {
                grid-template-columns: 1fr;
                padding: 20px 20px 80px;
                gap: 20px;
            }

            .studio-image.large {
                grid-column: span 1;
            }

            .studio-image.large img {
                aspect-ratio: 4 / 5;
            }

            .studio-image:not(.large) img {
                aspect-ratio: 4 / 5;
            }

            .back-section {
                padding: 0 20px 80px;
            }

            footer {
                padding: 25px 20px;

                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<header>

    <nav class="nav">

        <a href="index.html" class="logo">
            PATI YESTRO
        </a>

        <div class="nav-links">

            <a href="index.html#work">
                Work
            </a>

            <a href="works.html">
                Collections
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#statement">
                Statement
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </div>

    </nav>

</header>


<main>


    <!-- INTRODUCTION -->

    <section class="studio-intro">

        <div class="section-label">
            The Artist
        </div>

        <h1 class="studio-title">
            Inside the Studio
        </h1>

        <p class="studio-intro-text">
            A glimpse into the studio practice of Pati Yestro —
            the spaces, processes, and moments behind the paintings.
        </p>

    </section>


    <!-- STUDIO PHOTOGRAPHS -->

    <section class="studio-gallery">


        <!-- LARGE IMAGE -->

        <div class="studio-image large">

            <img
                src="https://placehold.co/1600x900/ded8cf/171513?text=Studio+Photograph+1"
                alt="Pati Yestro in the studio"
            >

        </div>


        <!-- IMAGE 2 -->

        <div class="studio-image">

            <img
                src="https://placehold.co/1000x1250/ded8cf/171513?text=Studio+Photograph+2"
                alt="Pati Yestro working in the studio"
            >

        </div>


        <!-- IMAGE 3 -->

        <div class="studio-image">

            <img
                src="https://placehold.co/1000x1250/ded8cf/171513?text=Studio+Photograph+3"
                alt="Pati Yestro with paintings"
            >

        </div>


        <!-- IMAGE 4 -->

        <div class="studio-image">

            <img
                src="https://placehold.co/1000x1250/ded8cf/171513?text=Studio+Photograph+4"
                alt="Pati Yestro painting"
            >

        </div>


        <!-- IMAGE 5 -->

        <div class="studio-image">

            <img
                src="https://placehold.co/1000x1250/ded8cf/171513?text=Studio+Photograph+5"
                alt="Pati Yestro in his studio"
            >

        </div>


    </section>


    <!-- BACK TO WORK -->

    <div class="back-section">

        <a
            href="index.html#work"
            class="back-link"
        >

            <span>←</span>

            Back to Selected Work

        </a>

    </div>


</main>


<footer>

    <div>
        © 2026 Pati Yestro
    </div>

    <div>
        Contemporary Visual Artist
    </div>

</footer>


</body>

</html>
