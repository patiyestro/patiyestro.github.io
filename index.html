<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pati Yestro | Contemporary Artist</title>

  <meta
    name="description"
    content="Pati Yestro is a contemporary Rwandan artist exploring memory, identity, resilience, transformation, and the human experience through painting."
  >

 <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #f3eee5;
    color: #171513;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  /* NAVIGATION */

  header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(243, 238, 229, 0.96);
    border-bottom: 1px solid #d6cec2;
    backdrop-filter: blur(8px);
  }

  nav {
    max-width: 1250px;
    margin: auto;
    padding: 22px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    letter-spacing: 4px;
    font-weight: normal;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
  }

  .nav-links a {
    transition: opacity 0.3s ease;
  }

  .nav-links a:hover {
    opacity: 0.45;
  }

  /* HERO */

  .hero {
    min-height: 88vh;
    max-width: 1250px;
    margin: auto;
    padding: 100px 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .hero-inner {
    max-width: 950px;
  }

  .hero h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(70px, 11vw, 145px);
    font-weight: normal;
    line-height: 0.88;
    letter-spacing: -5px;
    margin-bottom: 42px;
  }

  .hero-subtitle {
    max-width: 650px;
    margin: auto;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.8;
    letter-spacing: 0.2px;
    color: #625d56;
  }

  .hero-button {
    display: inline-block;
    margin-top: 40px;
    padding: 15px 34px;
    border: 1px solid #171513;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.3s ease;
  }

  .hero-button:hover {
    background: #171513;
    color: #f3eee5;
  }

  /* GENERAL SECTIONS */

  section {
    max-width: 1250px;
    margin: auto;
    padding: 115px 35px;
  }

  .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2.8px;
    color: #777067;
    margin-bottom: 18px;
  }

  .section-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(44px, 6vw, 72px);
    font-weight: normal;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 55px;
  }

  /* ABOUT */

  .about-grid {
    display: grid;
    grid-template-columns: 0.8fr 1.4fr;
    gap: 100px;
    align-items: start;
  }

  .about-text {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    line-height: 1.75;
    color: #4e4943;
  }

  .about-text p + p {
    margin-top: 27px;
  }

  /* ARTWORKS */

  .works-intro {
    max-width: 680px;
    color: #625d56;
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 60px;
  }

  .artwork-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 70px 35px;
  }

  .artwork-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #ded7cc;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .artwork-image span {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #817a72;
  }

  .artwork-info {
    padding-top: 17px;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    border-top: 1px solid #d1c8bc;
    margin-top: 12px;
  }

  .artwork-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    line-height: 1.3;
  }

  .artwork-details {
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #777067;
    text-align: right;
  }

  /* STATEMENT */

  .statement-section {
    border-top: 1px solid #d6cec2;
    border-bottom: 1px solid #d6cec2;
  }

  .statement {
    max-width: 900px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(30px, 4vw, 50px);
    line-height: 1.35;
    letter-spacing: -1px;
  }

  /* EXPERIENCE */

  .experience-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 55px 25px;
  }

  .experience-card {
    border-top: 1px solid #cfc6b9;
    padding-top: 20px;
  }

  .experience-year {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #777067;
    margin-bottom: 12px;
  }

  .experience-card h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: normal;
    line-height: 1.3;
    margin-bottom: 9px;
  }

  .experience-card p {
    font-size: 12px;
    line-height: 1.6;
    color: #625d56;
  }

  /* CONTACT */

  .contact-section {
    text-align: center;
  }

  .contact-section .section-title {
    margin-bottom: 25px;
  }

  .contact-text {
    color: #625d56;
    font-size: 16px;
    line-height: 1.8;
  }

  .contact-link {
    display: inline-block;
    margin-top: 30px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    border-bottom: 1px solid #171513;
    padding-bottom: 5px;
  }

  .social {
    margin-top: 25px;
    font-size: 10px;
    letter-spacing: 1.5px;
  }

  /* FOOTER */

  footer {
    border-top: 1px solid #d6cec2;
    padding: 30px 35px;
    text-align: center;
    font-size: 9px;
    color: #777067;
    text-transform: uppercase;
    letter-spacing: 1.8px;
  }

  /* MOBILE */

  @media (max-width: 750px) {

    nav {
      padding: 17px 20px;
    }

    .logo {
      font-size: 16px;
      letter-spacing: 3px;
    }

    .nav-links {
      gap: 12px;
      font-size: 8px;
      letter-spacing: 1.2px;
    }

    .hero {
      min-height: 78vh;
      padding: 70px 20px;
    }

    .hero h1 {
      font-size: clamp(58px, 17vw, 95px);
      letter-spacing: -3px;
      margin-bottom: 30px;
    }

    .hero-subtitle {
      font-size: 15px;
      line-height: 1.7;
    }

    section {
      padding: 85px 20px;
    }

    .section-title {
      letter-spacing: -1px;
    }

    .about-grid {
      grid-template-columns: 1fr;
      gap: 35px;
    }

    .about-text {
      font-size: 18px;
    }

    .artwork-grid {
      grid-template-columns: 1fr;
      gap: 55px;
    }

    .experience-grid {
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .artwork-info {
      flex-direction: column;
      gap: 6px;
    }

    .artwork-details {
      text-align: left;
    }

    footer {
      padding: 25px 20px;
    }
  }
